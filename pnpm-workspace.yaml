overrides:
  # OpenNext's minifier pins an old glob; the sync API is compatible, so bump it in place to fix the CLI command injection vulnerability (same as mail).
  "@node-minify/core@9.0.2>glob": ^13.0.6

# pnpm 12 does not run dependency install scripts by default, and unapproved ones fail outright in frozen-lockfile mode.
# wrangler runs workerd locally and bundles with esbuild; both need their install scripts to download platform binaries.
# sharp (used by next/image, not here) and unrs-resolver do not need theirs.
allowBuilds:
  esbuild: true
  workerd: true
  sharp: false
  unrs-resolver: false
