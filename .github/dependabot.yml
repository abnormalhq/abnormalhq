version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    # Wait a few days after a release before opening a PR, to skip versions that get yanked or poisoned right after publishing.
    cooldown:
      default-days: 3
      semver-major-days: 14
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    # Group minor / patch updates into one PR; majors still get their own so breaking changes can be reviewed one by one.
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint does not support TS 7 yet, so typescript stays on 6.x (aliased to @typescript/typescript6 in package.json).
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
