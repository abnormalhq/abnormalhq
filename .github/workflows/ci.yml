name: CI

# PRs and pushes to main only run the checks and the build. When it passes for a push to main, deploy.yml deploys main's latest commit
# (see "Deployment" in the README). This workflow needs no Cloudflare credentials and uploads no deploy artifacts.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A CI run started by hand gets its own group, so it never cancels a push's run: only a push's CI lets deploy.yml deploy.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && '-manual' || '' }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    # Blacksmith, as on status, mail and doppel; setup-node's pnpm cache and the Next.js cache below go to Blacksmith's cache next to
    # the runner.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        # No version here: pnpm/action-setup reads the packageManager field of package.json, so the version number is not duplicated.
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Preserve the published storefront contract
        env:
          CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$CONTRACT_BASE_SHA"
          git show "$CONTRACT_BASE_SHA:docs/onboard-contract.json" > "$RUNNER_TEMP/onboard-contract-base.json"
          node scripts/contract-compat.ts --baseline "$RUNNER_TEMP/onboard-contract-base.json"
      # next build (inside the OpenNext build) keeps its compiler cache in .next/cache; restored, it only recompiles what changed. Every
      # run restores the newest cache main saved for the same lockfile and Node version, and only pushes to main save one, so pull
      # requests do not crowd main's out of the repository's cache space (the same scheme as mail's build job).
      - name: Restore the Next.js build cache
        id: next-cache
        uses: actions/cache/restore@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}-${{ github.sha }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}-
      - name: Lint, typecheck, test, format check, build and validate Worker
        run: pnpm cf:build
      - name: Save the Next.js build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: .next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}
