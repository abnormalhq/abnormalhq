name: CI

# PRs and pushes to main only run the checks and the build; production deploys come from Cloudflare Workers Builds watching main directly (see "Deployment" in the README).
# This workflow needs no Cloudflare credentials and uploads no deploy artifacts.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        # No version here: pnpm/action-setup reads the packageManager field of package.json, so the version number is not duplicated.
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, test, format check, build and validate Worker
        run: pnpm cf:build
