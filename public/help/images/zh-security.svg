<svg
  xmlns="http://www.w3.org/2000/svg"
  width="720"
  height="544"
  viewBox="0 0 720 544"
  lang="zh"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">为不同入口选择登录方式</title>
  <desc id="desc">
    开启两步验证后：网页邮箱使用邮箱密码和验证器验证码，邮件客户端分别使用应用专用密码，恢复码单独妥善保存。
  </desc>
  <rect width="720" height="544" fill="#f6f6f1" />
  <g
    fill="#141412"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif"
  >
    <text x="36" y="37" font-size="14" letter-spacing="2" fill="#575750">ABNORMAL / 帮助图解</text>
    <text x="36" y="82" font-size="30" font-weight="600">为不同入口选择登录方式</text>
    <g transform="translate(0 120)">
      <path d="M58 76v58m-6-6 6 6 6-6" fill="none" stroke="#aaa99e" stroke-width="2" />
      <rect x="100" y="0" width="584" height="108" rx="12" fill="#fff" stroke="#ddddd4" />
      <circle cx="58" cy="40" r="22" fill="#ffe14d" />
      <text x="58" y="48" text-anchor="middle" font-size="22" font-weight="600">1</text>
      <text x="120" y="40" font-size="25" font-weight="600">登录网页邮箱</text>
      <text x="120" y="78" font-size="21" fill="#575750">邮箱密码 + 身份验证器里的验证码</text>
    </g>
    <g transform="translate(0 252)">
      <path d="M58 76v58m-6-6 6 6 6-6" fill="none" stroke="#aaa99e" stroke-width="2" />
      <rect x="100" y="0" width="584" height="108" rx="12" fill="#fff" stroke="#ddddd4" />
      <circle cx="58" cy="40" r="22" fill="#ffe14d" />
      <text x="58" y="48" text-anchor="middle" font-size="22" font-weight="600">2</text>
      <text x="120" y="40" font-size="25" font-weight="600">连接邮件、日历与通讯录应用</text>
      <text x="120" y="78" font-size="21" fill="#575750">为每个应用单独创建应用专用密码</text>
    </g>
    <g transform="translate(0 384)">
      <rect x="100" y="0" width="584" height="108" rx="12" fill="#fff" stroke="#ddddd4" />
      <circle cx="58" cy="40" r="22" fill="#ffe14d" />
      <text x="58" y="48" text-anchor="middle" font-size="22" font-weight="600">3</text>
      <text x="120" y="40" font-size="25" font-weight="600">验证器丢失时</text>
      <text x="120" y="78" font-size="21" fill="#575750">使用妥善保存的一次性恢复码登录</text>
    </g>
  </g>
</svg>
