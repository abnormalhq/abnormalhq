<svg
  xmlns="http://www.w3.org/2000/svg"
  width="720"
  height="676"
  viewBox="0 0 720 676"
  lang="en"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Connect your own domain</title>
  <desc id="desc">
    Domain setup: add the domain in My account, publish and verify the ownership TXT record, add the listed mail DNS
    records, then wait for approval before creating mailboxes.
  </desc>
  <rect width="720" height="676" fill="#f6f6f1" />
  <g
    fill="#141412"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif"
  >
    <text x="36" y="37" font-size="14" letter-spacing="2" fill="#575750">ABNORMAL / ILLUSTRATED HELP</text>
    <text x="36" y="82" font-size="30" font-weight="600">Connect your own domain</text>
    <g transform="translate(0 120)">
      <path d="M58 76v58m-6-6 6 6 6-6" fill="none" stroke="#aaa99e" stroke-width="2" />
      <rect x="100" y="0" width="584" height="108" rx="12" fill="#fff" stroke="#ddddd4" />
      <circle cx="58" cy="40" r="22" fill="#ffe14d" />
      <text x="58" y="48" text-anchor="middle" font-size="22" font-weight="600">1</text>
      <text x="120" y="40" font-size="25" font-weight="600">Add your domain</text>
      <text x="120" y="78" font-size="21" fill="#575750">My account → Use my own domain</text>
    </g>
    <g transform="translate(0 252)">
      <path d="M58 76v58m-6-6 6 6 6-6" fill="none" stroke="#aaa99e" stroke-width="2" />
      <rect x="100" y="0" width="584" height="108" rx="12" fill="#fff" stroke="#ddddd4" />
      <circle cx="58" cy="40" r="22" fill="#ffe14d" />
      <text x="58" y="48" text-anchor="middle" font-size="22" font-weight="600">2</text>
      <text x="120" y="40" font-size="25" font-weight="600">Prove ownership</text>
      <text x="120" y="78" font-size="21" fill="#575750">Publish the supplied TXT record, then verify</text>
    </g>
    <g transform="translate(0 384)">
      <path d="M58 76v58m-6-6 6 6 6-6" fill="none" stroke="#aaa99e" stroke-width="2" />
      <rect x="100" y="0" width="584" height="108" rx="12" fill="#fff" stroke="#ddddd4" />
      <circle cx="58" cy="40" r="22" fill="#ffe14d" />
      <text x="58" y="48" text-anchor="middle" font-size="22" font-weight="600">3</text>
      <text x="120" y="40" font-size="25" font-weight="600">Configure mail DNS</text>
      <text x="120" y="78" font-size="21" fill="#575750">Copy the records and check their status</text>
    </g>
    <g transform="translate(0 516)">
      <rect x="100" y="0" width="584" height="108" rx="12" fill="#fff" stroke="#ddddd4" />
      <circle cx="58" cy="40" r="22" fill="#ffe14d" />
      <text x="58" y="48" text-anchor="middle" font-size="22" font-weight="600">4</text>
      <text x="120" y="40" font-size="25" font-weight="600">Wait for approval</text>
      <text x="120" y="78" font-size="21" fill="#575750">Once active, create mailboxes on your domain</text>
    </g>
  </g>
</svg>
