<svg
  xmlns="http://www.w3.org/2000/svg"
  width="720"
  height="544"
  viewBox="0 0 720 544"
  lang="en"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Apply a discount before paying</title>
  <desc id="desc">
    Discount flow: enter a code in the shop, choose an eligible plan, then check the discount and final price on the
    order before paying.
  </desc>
  <rect width="720" height="544" fill="#f6f6f1" />
  <g
    fill="#141412"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif"
  >
    <text x="36" y="37" font-size="14" letter-spacing="2" fill="#575750">ABNORMAL / ILLUSTRATED HELP</text>
    <text x="36" y="82" font-size="30" font-weight="600">Apply a discount before paying</text>
    <g transform="translate(0 120)">
      <path d="M58 76v58m-6-6 6 6 6-6" fill="none" stroke="#aaa99e" stroke-width="2" />
      <rect x="100" y="0" width="584" height="108" rx="12" fill="#fff" stroke="#ddddd4" />
      <circle cx="58" cy="40" r="22" fill="#ffe14d" />
      <text x="58" y="48" text-anchor="middle" font-size="22" font-weight="600">1</text>
      <text x="120" y="40" font-size="25" font-weight="600">Enter your code in the shop</text>
      <text x="120" y="78" font-size="21" fill="#575750">Choose “I have a discount code” and apply it</text>
    </g>
    <g transform="translate(0 252)">
      <path d="M58 76v58m-6-6 6 6 6-6" fill="none" stroke="#aaa99e" stroke-width="2" />
      <rect x="100" y="0" width="584" height="108" rx="12" fill="#fff" stroke="#ddddd4" />
      <circle cx="58" cy="40" r="22" fill="#ffe14d" />
      <text x="58" y="48" text-anchor="middle" font-size="22" font-weight="600">2</text>
      <text x="120" y="40" font-size="25" font-weight="600">Pick an eligible plan</text>
      <text x="120" y="78" font-size="21" fill="#575750">Eligible plans show their discounted prices</text>
    </g>
    <g transform="translate(0 384)">
      <rect x="100" y="0" width="584" height="108" rx="12" fill="#fff" stroke="#ddddd4" />
      <circle cx="58" cy="40" r="22" fill="#ffe14d" />
      <text x="58" y="48" text-anchor="middle" font-size="22" font-weight="600">3</text>
      <text x="120" y="40" font-size="25" font-weight="600">Review the order, then pay</text>
      <text x="120" y="78" font-size="21" fill="#575750">Check the code, discount and final amount</text>
    </g>
  </g>
</svg>
