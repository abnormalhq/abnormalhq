<svg
  xmlns="http://www.w3.org/2000/svg"
  width="720"
  height="544"
  viewBox="0 0 720 544"
  lang="en"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">One mailbox, two connections</title>
  <desc id="desc">
    Mail app settings: use the full email address as the username, IMAP to receive and SMTP with authentication to send.
    Copy server names, ports and encryption from your own mailbox settings.
  </desc>
  <rect width="720" height="544" fill="#f6f6f1" />
  <g
    fill="#141412"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif"
  >
    <text x="36" y="37" font-size="14" letter-spacing="2" fill="#575750">ABNORMAL / ILLUSTRATED HELP</text>
    <text x="36" y="82" font-size="30" font-weight="600">One mailbox, two connections</text>
    <g transform="translate(0 120)">
      <path d="M58 76v58m-6-6 6 6 6-6" fill="none" stroke="#aaa99e" stroke-width="2" />
      <rect x="100" y="0" width="584" height="108" rx="12" fill="#fff" stroke="#ddddd4" />
      <circle cx="58" cy="40" r="22" fill="#ffe14d" />
      <text x="58" y="48" text-anchor="middle" font-size="22" font-weight="600">1</text>
      <text x="120" y="40" font-size="25" font-weight="600">Your identity</text>
      <text x="120" y="78" font-size="21" fill="#575750">Username = your full email address</text>
    </g>
    <g transform="translate(0 252)">
      <path d="M58 76v58m-6-6 6 6 6-6" fill="none" stroke="#aaa99e" stroke-width="2" />
      <rect x="100" y="0" width="584" height="108" rx="12" fill="#fff" stroke="#ddddd4" />
      <circle cx="58" cy="40" r="22" fill="#ffe14d" />
      <text x="58" y="48" text-anchor="middle" font-size="22" font-weight="600">2</text>
      <text x="120" y="40" font-size="25" font-weight="600">Receive with IMAP</text>
      <text x="120" y="78" font-size="21" fill="#575750">Copy the incoming server, port and encryption</text>
    </g>
    <g transform="translate(0 384)">
      <rect x="100" y="0" width="584" height="108" rx="12" fill="#fff" stroke="#ddddd4" />
      <circle cx="58" cy="40" r="22" fill="#ffe14d" />
      <text x="58" y="48" text-anchor="middle" font-size="22" font-weight="600">3</text>
      <text x="120" y="40" font-size="25" font-weight="600">Send with SMTP</text>
      <text x="120" y="78" font-size="21" fill="#575750">Copy outgoing settings; enable authentication</text>
    </g>
  </g>
</svg>
