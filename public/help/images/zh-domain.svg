<svg
  xmlns="http://www.w3.org/2000/svg"
  width="720"
  height="676"
  viewBox="0 0 720 676"
  lang="zh"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">接入自己的域名</title>
  <desc id="desc">
    域名接入流程：在我的账户添加域名，发布并验证所有权 TXT 记录，配置邮件 DNS 记录，等待审核开通后创建邮箱。
  </desc>
  <rect width="720" height="676" fill="#f6f6f1" />
  <g
    fill="#141412"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif"
  >
    <text x="36" y="37" font-size="14" letter-spacing="2" fill="#575750">ABNORMAL / 帮助图解</text>
    <text x="36" y="82" font-size="30" font-weight="600">接入自己的域名</text>
    <g transform="translate(0 120)">
      <path d="M58 76v58m-6-6 6 6 6-6" fill="none" stroke="#aaa99e" stroke-width="2" />
      <rect x="100" y="0" width="584" height="108" rx="12" fill="#fff" stroke="#ddddd4" />
      <circle cx="58" cy="40" r="22" fill="#ffe14d" />
      <text x="58" y="48" text-anchor="middle" font-size="22" font-weight="600">1</text>
      <text x="120" y="40" font-size="25" font-weight="600">添加域名</text>
      <text x="120" y="78" font-size="21" fill="#575750">我的账户 → 使用自己的域名</text>
    </g>
    <g transform="translate(0 252)">
      <path d="M58 76v58m-6-6 6 6 6-6" fill="none" stroke="#aaa99e" stroke-width="2" />
      <rect x="100" y="0" width="584" height="108" rx="12" fill="#fff" stroke="#ddddd4" />
      <circle cx="58" cy="40" r="22" fill="#ffe14d" />
      <text x="58" y="48" text-anchor="middle" font-size="22" font-weight="600">2</text>
      <text x="120" y="40" font-size="25" font-weight="600">验证所有权</text>
      <text x="120" y="78" font-size="21" fill="#575750">发布页面提供的 TXT 记录，再点「验证」</text>
    </g>
    <g transform="translate(0 384)">
      <path d="M58 76v58m-6-6 6 6 6-6" fill="none" stroke="#aaa99e" stroke-width="2" />
      <rect x="100" y="0" width="584" height="108" rx="12" fill="#fff" stroke="#ddddd4" />
      <circle cx="58" cy="40" r="22" fill="#ffe14d" />
      <text x="58" y="48" text-anchor="middle" font-size="22" font-weight="600">3</text>
      <text x="120" y="40" font-size="25" font-weight="600">配置邮件 DNS</text>
      <text x="120" y="78" font-size="21" fill="#575750">复制页面列出的记录，并检查生效状态</text>
    </g>
    <g transform="translate(0 516)">
      <rect x="100" y="0" width="584" height="108" rx="12" fill="#fff" stroke="#ddddd4" />
      <circle cx="58" cy="40" r="22" fill="#ffe14d" />
      <text x="58" y="48" text-anchor="middle" font-size="22" font-weight="600">4</text>
      <text x="120" y="40" font-size="25" font-weight="600">等待审核开通</text>
      <text x="120" y="78" font-size="21" fill="#575750">显示「已开通」后，即可选择此域名创建邮箱</text>
    </g>
  </g>
</svg>
